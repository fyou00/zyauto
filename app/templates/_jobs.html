<div id="jobs" hx-get="/jobs" hx-trigger="every {{ poll_sec }}s" hx-swap="outerHTML">
  <table border="1">
    <tr>
      <th>Nama</th>
      <th>Status</th>
      <th>Dibuat (UTC)</th>
      <th>Hasil</th>
    </tr>
    {% for job in jobs %}
    <tr>
      <td>{{ job.original_name }}</td>
      <td>{{ job.status }}</td>
      <td>{{ job.created_at }}</td>
      <td>{% if job.status == 'done' and job.output_path %}<a href="/jobs/{{ job.id }}/download">Download</a>{% endif %}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">Belum ada job.</td></tr>
    {% endfor %}
  </table>
</div>
